services:
  postgres:
    image: postgres:16-alpine
    container_name: research-trail-postgres-2
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchtrail
      POSTGRES_PASSWORD: researchtrail
      POSTGRES_DB: researchtrail
    ports:
      - "5432:5432"
    volumes:
      - research_trail_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchtrail -d researchtrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  research_trail_postgres:
